name: fare-check
on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "collect (default) or digest"
        type: choice
        options: [collect, digest]
        default: collect
      test:
        description: "Send a Discord test message only"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: fare-check
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python flight_alert.py --mode ${{ inputs.mode || 'collect' }} ${{ inputs.test && '--test' || '' }}
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - run: |
          git config user.name "fare-bot" && git config user.email "fare-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "update prices"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
