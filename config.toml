[search]
origins = ["ICN", "GMP"]
# Japan cities with direct-flight data (found 2026-09-20). Minor cities have very sparse data.
cities = ["TYO", "OSA", "FUK", "OKA", "NGO", "SPK", "HIJ", "FSZ", "SDJ", "KOJ", "KMQ", "MYJ", "KIJ", "KMJ", "NGS", "KMI", "TAK", "YGJ", "SHI", "KKJ", "AOJ", "ISG"]
horizon_days = 180
currency = "krw"
airlines_exclude = []   # e.g. ["MM", "ZG"]

# Airline classes for summary.json; unlisted codes (H1, ET, ...) only count toward the overall cheapest.
[classes]
fsc = ["KE", "OZ", "JL", "NH"]
hsc = ["YP", "WE"]
lcc = ["7C", "LJ", "TW", "ZE", "BX", "RS", "MM", "ZG"]

[alert]
warmup_days = 7        # learn-only period after the first observation
lookback_days = 60
percentile = 10        # price must be at or below this percentile of history
min_drop = 0.15        # and at least this far below the median
min_samples = 20       # per (series, days-to-departure bucket); below this we only learn
realert_drop = 0.05    # re-alert same flight only if this much cheaper than last alert
buckets = [30, 90]     # days-to-departure buckets: <=30, 31-90, >90
max_price = 0          # 0 = off
max_alerts_per_run = 10
digest_slots_utc = [0, 9]   # 09:00 and 18:00 KST
digest_grace_min = 30      # collect sends a digest itself if the scheduled one is this late
pending_hours = 48         # candidates older than this are dropped
bucket_quota = [3, 4, 3]  # slots per bucket (len = len(buckets)+1, sum = max_alerts_per_run); unused slots spill over

# Instant single alerts for standout fares (all conditions must hold)
[deal]
min_days = 15       # at least this many days until departure
min_samples = 50    # samples in the same series/bucket over lookback_days
drop = 0.30         # at least this far below that median; also an all-time low for the whole series
daily_cap = 3       # alerts per KST day (one alert may list several departure dates)
repeat_hours = 72   # same route+departure date is not alerted again within this time
